[project]
name = "bank-reconciliation-agent"
version = "1.0.0"
description = "Rules-first, tool-calling agent that reconciles NZ small-business bank lines to invoices, measured with replayable evals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Necmi Kural" }]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.43.0",
    "holidays>=0.106",
    "mcp>=2.3,<3",
    "openai>=3.34.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recon"

[dependency-groups]
dev = [
    "pytest>=8",
    "rich>=15.0.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
